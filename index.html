<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verdant Micro & Sprouts — Hyderabad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1E2B20;
      background-color: #F3EFE6;
      background-image:
        radial-gradient(at 0% 0%, rgba(162, 227, 196, 0.25) 0px, transparent 48%),
        radial-gradient(at 100% 10%, rgba(217, 235, 210, 0.5) 0px, transparent 52%),
        radial-gradient(at 80% 95%, rgba(245, 230, 211, 0.65) 0px, transparent 50%),
        radial-gradient(rgba(21, 42, 27, 0.055) 1px, transparent 0);
      background-size: 100% 100%, 100% 100%, 100% 100%, 26px 26px;
      background-attachment: fixed;
      margin: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    .font-serif {
      font-family: 'Cinzel', serif;
    }

    /* Smooth custom scrollbar matching the organic palette */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #F3EFE6;
    }

    ::-webkit-scrollbar-thumb {
      background: #C7D3C5;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #2C6E49;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
